name: Build Raksha AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # अगर आपने सीधे zip अपलोड की है, तो यह उसे अपने आप एक्सट्रैक्ट कर देगा
      - name: Unzip project if uploaded as zip
        run: |
          if [ -f "raksha-ai.zip" ]; then
            unzip -o raksha-ai.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RakshaAI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
