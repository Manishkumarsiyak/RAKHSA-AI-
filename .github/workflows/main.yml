name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Force Unzip and Structure Fix
        run: |
          mkdir -p project_folder
          unzip -q raksha-ai.zip -d project_folder || true
          
          # यदि ज़िप के अंदर कोई अन्य ज़िप छिपी है तो उसे भी खोलें
          find project_folder -name "*.zip" -exec unzip -q {} -d project_folder \;
          
          echo "=== Checking Inside Project Folder ==="
          find project_folder -maxdepth 4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto Initialize Gradle If Missing
        run: |
          # ऐसी जगह ढूंढें जहां AndroidManifest.xml या src फोल्डर हो
          MANIFEST_DIR=$(find project_folder -name "AndroidManifest.xml" -exec dirname {} \; | sed 's/\/src\/main//g' | head -n 1)
          
          if [ -z "$MANIFEST_DIR" ]; then
            echo "❌ Error: No valid Android Source Code structure found anywhere inside the zip file."
            exit 1
          fi
          
          cd "$MANIFEST_DIR"
          
          # यदि build.gradle गायब है तो एक बेसिक कॉन्फ़िगरेशन बनाएं
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "Generating fallback build.gradle..."
            echo -e "plugins {\n    id 'com.android.application'\n}\nandroid {\n    compileSdk 34\n    defaultConfig {\n        applicationId \"com.rakshaai.v5\"\n        minSdk 26\n        targetSdk 34\n        versionCode 5\n        versionName \"5.0.0\"\n    }\n}" > build.gradle
          fi
          
          # यदि ग्रेडल रैपर गायब है तो उसे इंस्टॉल करें
          if [ ! -f "gradlew" ]; then
            echo "Installing missing Gradle Wrapper..."
            gradle wrapper --gradle-version 8.2
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: raksha-ai-apk
          path: project_folder/**/build/outputs/apk/debug/*.apk
