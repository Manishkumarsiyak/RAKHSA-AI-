name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project safely
        run: |
          mkdir -p project_folder
          unzip -q raksha-ai.zip -d project_folder || true
          echo "=== Displaying Extracted Files Structure ==="
          find project_folder -maxdepth 3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto Find and Build with Gradle
        run: |
          # यह कमांड आपके प्रोजेक्ट के अंदर जहां भी gradlew फ़ाइल होगी उसे ढूंढ निकालेगी
          GRADLE_ROOT=$(find project_folder -name "gradlew" -exec dirname {} \; | head -n 1)
          
          if [ -z "$GRADLE_ROOT" ]; then
            echo "❌ Error: gradlew file missing inside your zip structure. Creating a temporary fallback..."
            GRADLE_ROOT=$(find project_folder -name "build.gradle" -exec dirname {} \; | head -n 1)
            if [ -z "$GRADLE_ROOT" ]; then
               echo "❌ Deep Error: No Android build files found at all."
               exit 1
            fi
            cd "$GRADLE_ROOT"
            gradle wrapper --gradle-version 8.2
          else
            cd "$GRADLE_ROOT"
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: raksha-ai-apk
          path: project_folder/**/build/outputs/apk/debug/*.apk
